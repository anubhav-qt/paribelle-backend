services:
  # Backend API
  - type: web
    name: marketplace-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    # FIRST deploy only (fresh Supabase DB): builds all tables from entities,
    # baselines the migration history, seeds the admin, then starts.
    #   startCommand: npm run supabase:first_time && node dist/main
    # Every deploy after that: run pending migrations, then start.
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      # Set in the Render dashboard to the Supabase Singapore (ap-southeast-1)
      # Supavisor SESSION pooler URL, port 5432. Not managed by Render anymore.
      - key: DATABASE_URL
        sync: false
      - key: npm_config_sharp_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/
      - key: npm_config_sharp_libvips_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/
