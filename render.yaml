services:
  # Backend API
services:
  # Backend API
  - type: web
    name: marketplace-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: |
      echo "📦 Installing dependencies..."
      npm ci --legacy-peer-deps --include=optional || exit 1
      echo "🔨 Building application..."
      NODE_OPTIONS="--max-old-space-size=512" npm run build || exit 1
      echo "📂 Checking dist folder..."
      ls -la
      if [ -d "dist" ]; then
        echo "✅ dist folder created"
        ls -la dist/
      else
        echo "❌ dist folder not created!"
        exit 1
      fi
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: npm_config_sharp_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/
      - key: npm_config_sharp_libvips_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/

databases:
  # PostgreSQL Database
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user
    plan: free
