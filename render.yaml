services:
  # Backend API
  - type: web
    name: marketplace-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: node run-migrations.js && node dist/database/seed-runner.js && node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: npm_config_sharp_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/
      - key: npm_config_sharp_libvips_binary_host
        value: https://github.com/lovell/sharp-libvips/releases/download/

databases:
  # PostgreSQL Database
  - name: marketplace-db
    databaseName: marketplace
    user: marketplace_user
    plan: free
