# Every push to main: build the API image for the ThinkPad and publish it to GHCR.
# Then it tells the ThinkPad, which updates straight away (pom's infra/hook.mjs) and runs
# the migrations against its own database first. Render keeps building main from source.
name: image

on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paribelle-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is up: tell the ThinkPad, so it updates now (pom's infra/hook.mjs).
      # Without the secret, or if it doesn't answer, it still does at its next 5-minute check.
      - name: Tell the ThinkPad
        env: { KEY: "${{ secrets.THINKPAD_DEPLOY_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "No THINKPAD_DEPLOY_KEY secret: the ThinkPad updates at its next 5-minute check."; exit 0; }
          curl -fsS --max-time 20 --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $KEY" -H "X-Paribelle-Repo: $GITHUB_REPOSITORY" \
            https://laptop.paribelle.in/_paribelle/deploy ||
            echo "::warning::The ThinkPad didn't answer; it updates at its next 5-minute check."
